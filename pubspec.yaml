name: pgmaster
description: PG management app — tenants, fee collection, maintenance, notices.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  cloud_functions: ^5.0.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  file_picker: 8.3.7
  firebase_storage: ^12.4.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
